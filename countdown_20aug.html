<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Countdown to Aug 20</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f0c29;font-family:system-ui,sans-serif;color:#fff}
.box{text-align:center;padding:2rem}
h1{font-size:clamp(1.2rem,4vw,1.8rem);font-weight:300;letter-spacing:.12em;text-transform:uppercase;opacity:.85;margin-bottom:.3rem}
.d{font-size:.95rem;opacity:.5;margin-bottom:2.5rem}
.c{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap}
.t{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:1.2rem 1.5rem;min-width:80px}
.n{font-size:clamp(2.2rem,7vw,3.5rem);font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.l{font-size:.7rem;text-transform:uppercase;letter-spacing:.15em;opacity:.55;margin-top:.4rem}
.m{margin-top:2rem;font-size:1.1rem;opacity:.7;min-height:1.4em}
.e{font-size:clamp(1.4rem,4vw,2.2rem);font-weight:600;background:linear-gradient(90deg,#f472b6,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
</style>
</head>
<body>
<div class="box">
<h1>Countdown</h1>
<p class="d">Until August 20, 2026</p>
<div class="c" id="c">
<div class="t"><div class="n" id="d">00</div><div class="l">Days</div></div>
<div class="t"><div class="n" id="h">00</div><div class="l">Hours</div></div>
<div class="t"><div class="n" id="m">00</div><div class="l">Mins</div></div>
<div class="t"><div class="n" id="s">00</div><div class="l">Secs</div></div>
</div>
<p class="m" id="msg"></p>
</div>
<script>
const t=new Date(2026,7,20).getTime();
function u(){const n=Date.now(),x=t-n;if(x<=0){document.getElementById('c').style.display='none';document.getElementById('msg').innerHTML='<span class="e">It\'s August 20!</span>';return}document.getElementById('d').textContent=String(Math.floor(x/864e5)).padStart(2,'0');document.getElementById('h').textContent=String(Math.floor(x%864e5/36e5)).padStart(2,'0');document.getElementById('m').textContent=String(Math.floor(x%36e5/6e4)).padStart(2,'0');document.getElementById('s').textContent=String(Math.floor(x%6e4/1e3)).padStart(2,'0')}
u();setInterval(u,1e3)
</script>
</body>
</html>
