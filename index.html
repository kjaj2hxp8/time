<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Countdown</title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;
  background:#090909;color:#eee;
  font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  font-weight:300;
}
body{display:grid;place-items:center}
.wrap{text-align:center}
.date{
  margin-bottom:24px;
  font-size:13px;
  color:#777;
  letter-spacing:.04em;
}
.date span{
  color:#eee;
}
.days{display:flex;gap:10px;justify-content:center}
.day{
  width:28px;height:28px;border-radius:50%;
  border:1px solid #444;background:transparent
}
.day.done{background:#eee;border-color:#eee}
.info{
  margin-top:22px;
  font-size:14px;
  font-weight:300;
  letter-spacing:.02em;
  color:#888;
}
.info span{color:#eee}
</style>
</head>
<body>
<main class="wrap">
  <div class="date">2 Oct 2026 — 11 Oct 2026 <span id="present"> — 2 Oct 2026</span></div>
  <div class="days" id="days"></div>
  <div class="info">
    <span id="percent">10%</span> · <span id="left">9 days left</span>
  </div>
</main>

<script>
const start = new Date(2026,9,2);
const total = 10;
const days = document.getElementById("days");
const percent = document.getElementById("percent");
const left = document.getElementById("left");

for(let i=0;i<total;i++){
  const c=document.createElement("div");
  c.className="day";
  c.title=`${i+2} October 2026`;
  days.appendChild(c);
}

function update(){
  const now=new Date();
  const today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  let elapsed=Math.floor((today-start)/86400000)+1;
  elapsed=Math.max(0,Math.min(total,elapsed));
  const remaining=total-elapsed;

  [...days.children].forEach((c,i)=>{
    c.classList.toggle("done",i<elapsed);
  });

  percent.textContent=Math.round((elapsed/total)*100)+"%";
  left.textContent=remaining===1?"1 day left":`${remaining} days left`;
}
update();
setInterval(update,60000);
</script>
</body>
</html>
