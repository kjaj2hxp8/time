<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>175+ Target Countdown</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #0b0b0f;
        color: white;
        text-align: center;
    }

    .container {
        padding: 40px;
        border-radius: 20px;
        background: #15151d;
        box-shadow: 0 0 30px rgba(255,255,255,0.1);
    }

    h1 {
        font-size: 3rem;
        margin-bottom: 10px;
    }

    h2 {
        color: #aaa;
        margin-bottom: 30px;
    }

    .timer {
        display: flex;
        gap: 20px;
        justify-content: center;
        flex-wrap: wrap;
    }

    .box {
        background: #22222d;
        padding: 20px;
        border-radius: 12px;
        min-width: 100px;
    }

    .number {
        font-size: 3rem;
        font-weight: bold;
    }

    .label {
        color: #aaa;
        margin-top: 5px;
    }

    .quote {
        margin-top: 30px;
        color: #ddd;
        font-style: italic;
        font-size: 1.2rem;
    }
</style>

</head>

<body>

<div class="container">

    <h1>175+ TARGET</h1>
    <h2>Deadline: 20 August 2026</h2>

    <div class="timer">

        <div class="box">
            <div class="number" id="days">0</div>
            <div class="label">Days</div>
        </div>

        <div class="box">
            <div class="number" id="hours">0</div>
            <div class="label">Hours</div>
        </div>

        <div class="box">
            <div class="number" id="minutes">0</div>
            <div class="label">Minutes</div>
        </div>

        <div class="box">
            <div class="number" id="seconds">0</div>
            <div class="label">Seconds</div>
        </div>

    </div>

    <p class="quote">
        "175+ or nothing. Every second counts."
    </p>

</div>


<script>

const deadline = new Date("August 20, 2026 23:59:59").getTime();

function updateTimer() {

    const now = new Date().getTime();
    const distance = deadline - now;

    if (distance <= 0) {
        document.querySelector(".timer").innerHTML = "DEADLINE REACHED";
        return;
    }

    const days = Math.floor(distance / (1000 * 60 * 60 * 24));

    const hours = Math.floor(
        (distance % (1000 * 60 * 60 * 24)) /
        (1000 * 60 * 60)
    );

    const minutes = Math.floor(
        (distance % (1000 * 60 * 60)) /
        (1000 * 60)
    );

    const seconds = Math.floor(
        (distance % (1000 * 60)) /
        1000
    );


    document.getElementById("days").innerHTML = days;
    document.getElementById("hours").innerHTML = hours;
    document.getElementById("minutes").innerHTML = minutes;
    document.getElementById("seconds").innerHTML = seconds;

}


setInterval(updateTimer, 1000);
updateTimer();

</script>

</body>
</html>
